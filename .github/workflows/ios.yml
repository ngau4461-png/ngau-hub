name: Build Ngau Hub iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Node.js 22
      # Capacitor 8 requires Node.js 22+
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 4. Build React/Vite
      # ==========================================
      - name: Build web app
        run: npm run build

      # ==========================================
      # 5. Sync Capacitor iOS
      # ==========================================
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ==========================================
      # 6. Show Xcode information
      # ==========================================
      - name: Show Xcode information
        run: |
          xcodebuild -version
          echo "======================================"
          echo "Available iOS schemes:"
          echo "======================================"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -list

      # ==========================================
      # 7. Archive iOS app WITHOUT Apple signing
      # ==========================================
      #
      # IMPORTANT:
      # We intentionally disable code signing because
      # this workflow does not use an Apple Developer
      # certificate/provisioning profile.
      #
      # This creates a real iPhone/iOS build, NOT
      # an iOS Simulator build.
      # ==========================================
      - name: Archive iOS app
        working-directory: ios
        run: |
          rm -rf "$RUNNER_TEMP/NgauHub.xcarchive"

          xcodebuild \
            -project App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NgauHub.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # ==========================================
      # 8. Create unsigned IPA
      # ==========================================
      #
      # IPA structure:
      #
      # NgauHub.ipa
      # └── Payload
      #     └── App.app
      #
      # This is the standard IPA container format.
      # ==========================================
      - name: Create IPA
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          APP_PATH="$RUNNER_TEMP/NgauHub.xcarchive/Products/Applications/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app was not found!"
            echo ""
            echo "Archive contents:"
            find "$RUNNER_TEMP/NgauHub.xcarchive" \
              -maxdepth 5 \
              -print
            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/App.app"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/NgauHub.ipa" \
            Payload

          echo ""
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh "$GITHUB_WORKSPACE/NgauHub.ipa"

      # ==========================================
      # 9. Verify IPA
      # ==========================================
      - name: Verify IPA
        run: |
          set -e

          if [ ! -f "$GITHUB_WORKSPACE/NgauHub.ipa" ]; then
            echo "ERROR: NgauHub.ipa does not exist!"
            exit 1
          fi

          echo "IPA size:"
          ls -lh "$GITHUB_WORKSPACE/NgauHub.ipa"

          echo ""
          echo "IPA contents:"
          unzip -l "$GITHUB_WORKSPACE/NgauHub.ipa"

          echo ""
          echo "======================================"
          echo "IPA BUILD SUCCESS"
          echo "======================================"

      # ==========================================
      # 10. Upload IPA to GitHub Actions
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NgauHub-iOS-IPA
          path: NgauHub.ipa
          if-no-files-found: error
          retention-days: 30